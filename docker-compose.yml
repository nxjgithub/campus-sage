services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${CSAGE_DATABASE_URL_INTERNAL:-mysql+pymysql://${CSAGE_MYSQL_USER:-csage}:csage123@mysql:3306/${CSAGE_MYSQL_DATABASE:-csage}?charset=utf8mb4}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      INGEST_QUEUE_ENABLED: "true"
      INGEST_REQUIRE_HTTP_EMBEDDING: ${INGEST_REQUIRE_HTTP_EMBEDDING:-true}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-http}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_INTERNAL:-http://tei:80/v1}
      EMBEDDING_API_PATH: ${EMBEDDING_API_PATH_INTERNAL:-/embeddings}
      RERANK_BACKEND: ${RERANK_BACKEND:-simple}
      RERANK_BASE_URL: ${RERANK_BASE_URL_INTERNAL:-http://rerank:80}
      RERANK_API_PATH: ${RERANK_API_PATH:-/rerank}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_INTERNAL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-campus-sage-assets}
      S3_PREFIX: ${S3_PREFIX:-campus-sage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-campus_sage_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-campus_sage_minio_secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      NO_PROXY: ${NO_PROXY_INTERNAL:-mysql,qdrant,tei,redis,minio,localhost,127.0.0.1}
      no_proxy: ${NO_PROXY_INTERNAL:-mysql,qdrant,tei,redis,minio,localhost,127.0.0.1}
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "8010:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${CSAGE_DATABASE_URL_INTERNAL:-mysql+pymysql://${CSAGE_MYSQL_USER:-csage}:csage123@mysql:3306/${CSAGE_MYSQL_DATABASE:-csage}?charset=utf8mb4}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      INGEST_QUEUE_ENABLED: "true"
      INGEST_REQUIRE_HTTP_EMBEDDING: ${INGEST_REQUIRE_HTTP_EMBEDDING:-true}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-http}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_INTERNAL:-http://tei:80/v1}
      EMBEDDING_API_PATH: ${EMBEDDING_API_PATH_INTERNAL:-/embeddings}
      RERANK_BACKEND: ${RERANK_BACKEND:-simple}
      RERANK_BASE_URL: ${RERANK_BASE_URL_INTERNAL:-http://rerank:80}
      RERANK_API_PATH: ${RERANK_API_PATH:-/rerank}
      ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_INTERNAL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-campus-sage-assets}
      S3_PREFIX: ${S3_PREFIX:-campus-sage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-campus_sage_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-campus_sage_minio_secret}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      NO_PROXY: ${NO_PROXY_INTERNAL:-mysql,qdrant,tei,redis,minio,localhost,127.0.0.1}
      no_proxy: ${NO_PROXY_INTERNAL:-mysql,qdrant,tei,redis,minio,localhost,127.0.0.1}
    command: [ "python", "-m", "app.ingest.worker_runner", "--queue", "ingest" ]
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
  mysql:
    image: mysql:8.4
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=128M"
      - "--innodb-log-buffer-size=16M"
      - "--performance-schema=OFF"
    environment:
      MYSQL_DATABASE: ${CSAGE_MYSQL_DATABASE:-csage}
      MYSQL_USER: ${CSAGE_MYSQL_USER:-csage}
      MYSQL_PASSWORD: ${CSAGE_MYSQL_PASSWORD:-csage123}
      MYSQL_ROOT_PASSWORD: ${CSAGE_MYSQL_ROOT_PASSWORD:-csage_root}
    ports:
      - "${CSAGE_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CSAGE_MYSQL_ROOT_PASSWORD:-csage_root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  qdrant:
    image: qdrant/qdrant:v1.9.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.8
    ports:
      - "8080:80"
      - "9000:9000"
    volumes:
      - tei_data:/data
    shm_size: "1g"
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    command:
      - "--model-id"
      - "${TEI_MODEL_ID:-BAAI/bge-m3}"
      - "--auto-truncate"
      - "--max-client-batch-size"
      - "${TEI_MAX_CLIENT_BATCH_SIZE:-8}"
      - "--max-concurrent-requests"
      - "${TEI_MAX_CONCURRENT_REQUESTS:-64}"
  rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.8
    ports:
      - "8081:80"
    volumes:
      - rerank_data:/data
    shm_size: "1g"
    gpus: all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    command:
      - "--model-id"
      - "${RERANK_MODEL_NAME:-BAAI/bge-reranker-base}"
      - "--max-client-batch-size"
      - "${RERANK_MAX_CLIENT_BATCH_SIZE:-8}"
      - "--max-concurrent-requests"
      - "${RERANK_MAX_CONCURRENT_REQUESTS:-64}"
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-campus_sage_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-campus_sage_minio_secret}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-campus_sage_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-campus_sage_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-campus-sage-assets}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "minio,localhost,127.0.0.1"
      no_proxy: "minio,localhost,127.0.0.1"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID:-campus_sage_minio}" "$${S3_SECRET_ACCESS_KEY:-campus_sage_minio_secret}"; do sleep 2; done &&
        mc mb -p "local/$${S3_BUCKET:-campus-sage-assets}" || true

volumes:
  mysql_data:
  qdrant_data:
  redis_data:
  tei_data:
  rerank_data:
  minio_data:
